# Documentation Constraint Configuration
# Schema: docs-constraint/v1

schema: docs-constraint/v1

# ============================================================
# TIER TAXONOMY - one home per fact
# ============================================================

tiers:
  - name: root-agents
    pattern: "AGENTS.md"
    job: "Standing orders for agents"
    budget: 1600
    required: true

  - name: architecture
    pattern: "docs/architecture.md"
    job: "Composition and extension points"
    budget: 1800
    required: false

  - name: subsystems
    pattern: "docs/**/*.md"
    job: "Type definitions and semantics"
    budget: null
    required: false

  - name: agent-notes
    pattern: ".agents/notes/*/*.md"
    job: "Decision rationale (unbudgeted)"
    budget: null
    required: false

# ============================================================
# BILINGUAL PAIRING - three-file triplets
# ============================================================

i18n:
  enabled: true
  source_language: en
  target_languages:
    - zh
  suffix_map:
    zh: ".zh.md"
  scope_patterns:
    - "docs/**/*.md"
    - "README.md"
    # Decision records are the docs a reader most needs in their own language.
    # This glob matches {lifecycle}/{class}/file.md only, so the tree's instruction
    # files (README.md, AGENTS.md) stay single-language like other instructions.
    - ".agents/notes/*/*/*.md"
  exclusions:
    # Agent instructions - maintained in English only
    - "docs/AGENTS.md"
    - "AGENTS.md"
    - "CLAUDE.md"
    # Archived Agent Notes are frozen
    - ".agents/notes/archived"
    # Shipped format spec: drop this line to translate it like any other document
    - "docs/doc-header.md"

# ============================================================
# MECHANICAL GATES
# ============================================================

gates:
  verify_doc_budgets: true
  verify_doc_headers: true
  verify_md_links: true
  verify_translation_pairing: true
  verify_agent_note_format: true
  verify_agent_note_classification: true
  verify_archived_agent_notes: true

gate_config:
  verify_doc_budgets:
    headroom_percent: 5
    fail_on_missing: true

  verify_doc_headers:
    # Documents that must carry a header block; see docs/doc-header.md.
    scope_patterns:
      - "docs/**/*.md"
    exclusions:
      - "docs/AGENTS.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - ".agents/notes"
    # required: false audits only documents that already carry a header (staged adoption)
    required: true
    allowed_types: [spec, subsystem, reference, architecture, runbook, postmortem]
    # Types without an entry here are not pinned to a tier; add e.g. runbook: [cookbook]
    # once the repository declares that tier.
    type_tiers:
      spec: [subsystems]
      subsystem: [subsystems]
      reference: [subsystems]
      architecture: [architecture]
    require_review: true
    check_tests: true
    check_drift: true
    max_age_days: 180

# ============================================================
# CI INTEGRATION
# ============================================================

ci:
  platform: github
  on_pull_request: true
  on_push_main: true
  fail_on_violation: true
